; EXAMPLE: configure the server and CNC addresses before installation.
[server]
listen = 127.0.0.1
ports = 6743-6757
allowed_clients = 127.0.0.1/32
timeout = 30
max_clients = 16
max_file_size = 67108864
encoding = cp1252
log_level = INFO
auth = credentials
username = pcu20
password = CHANGE_ME
truncate_on_write = true

[share:PCU20]
path = /srv/pcu20
read_only = false
